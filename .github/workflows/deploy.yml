name: deploy

# main への push でビルドし、S3 に「置くだけ」。EC2 側の release-sync.timer が 60 秒以内に拾う。
# このリポには内部トークンを一切置かない。AWS へは OIDC で短命トークンを得てロールを引き受ける。
# 必要なリポジトリ変数（Settings > Variables、秘密ではない識別子）:
#   AWS_DEPLOY_ROLE_ARN  … OIDC 信頼ポリシーで本リポの main のみ許可された IAM ロール
#   WR_BUCKET            … リリース用 S3 バケット名

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_VERSION: v${{ github.run_number }}
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: build
        run: npm run build
      - name: bundle size gate
        run: npm run check:size
      - name: write release manifest
        run: |
          printf '{"version":"%s","git_sha":"%s","built_at":"%s"}\n' \
            "$APP_VERSION" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.json
          cat dist/release.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: upload release
        run: |
          aws s3 sync dist/ "s3://${{ vars.WR_BUCKET }}/releases/$APP_VERSION/" --only-show-errors --delete
      - name: switch current.json
        run: |
          printf '{"version":"%s","git_sha":"%s","deployed_at":"%s"}\n' \
            "$APP_VERSION" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > current.json
          aws s3 cp current.json "s3://${{ vars.WR_BUCKET }}/current.json" --only-show-errors \
            --cache-control "no-cache"
          echo "deployed $APP_VERSION ($GITHUB_SHA)"
