<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="data:," />
    <title>週刊ランナー</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas { display: block; image-rendering: pixelated; }
      #overlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
      .screen { pointer-events: auto; text-align: center; padding: 16px; max-width: 360px; width: calc(100% - 32px); }
      .screen[hidden] { display: none; }
      #title { background: rgba(15, 23, 42, 0.55); border-radius: 12px; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      .sub { margin: 0 0 16px; opacity: 0.8; font-size: 14px; }
      .btn { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px; font-size: 16px; border: 0; border-radius: 10px; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; }
      .btn.secondary { background: #334155; color: #f8fafc; }
      .btn:disabled { opacity: 0.5; }
      #gameover { background: rgba(15, 23, 42, 0.9); border-radius: 12px; }
      #gameover .score { font-size: 22px; margin: 4px 0 12px; }
      #panels { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
      .panel { pointer-events: auto; background: #1e293b; border-radius: 12px; padding: 16px; width: calc(100% - 48px); max-width: 360px; max-height: 80vh; overflow: auto; box-sizing: border-box; }
      .panel h2 { margin: 0 0 12px; font-size: 18px; }
      .panel-body { display: grid; gap: 8px; margin-bottom: 8px; }
      .panel select, .panel textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: inherit; }
      .note { margin: 0; font-size: 13px; opacity: 0.85; min-height: 1em; }
      .ad-counter { font-size: 20px; text-align: center; margin: 8px 0; }
      .proposal { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
      .report { white-space: pre-wrap; font: 13px/1.5 system-ui, sans-serif; margin: 0; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>
    <div id="overlay">
      <section id="title" class="screen">
        <h1 data-s="title"></h1>
        <p class="sub" data-s="subtitle"></p>
        <button id="start" type="button" class="btn" data-s="tapToStart"></button>
      </section>
      <section id="gameover" class="screen" hidden>
        <h1 data-s="gameOver"></h1>
        <p class="score"><span data-s="distanceLabel"></span> <span id="final-distance">0</span><span data-s="meterUnit"></span></p>
        <button id="retry" type="button" class="btn" data-s="retry"></button>
        <button id="btn-feedback" type="button" class="btn secondary" data-s="sendFeedback"></button>
        <button id="btn-ad" type="button" class="btn secondary" data-s="watchAd"></button>
        <button id="btn-vote" type="button" class="btn secondary" data-s="vote"></button>
        <button id="btn-report" type="button" class="btn secondary" data-s="patchNotes"></button>
      </section>
    </div>
    <div id="panels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
